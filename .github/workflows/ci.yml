name: Clin compatibility core

on:
  push:
    branches: [fix/maintained-yaml-msrv-1.90]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p merman-core-clin --all-features
      - run: cargo test --locked -p merman-core-clin --no-default-features
      - run: cargo package --locked -p merman-core-clin
