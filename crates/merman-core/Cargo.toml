[package]
name = "merman-core-clin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/reekta92/merman"
rust-version = "1.90"
description = "Clin compatibility fork of merman-core 0.6 with a maintained YAML backend"
documentation = "https://docs.rs/merman-core-clin"
readme = "README.md"
keywords = ["mermaid", "diagrams", "parser", "ast"]
categories = ["parser-implementations", "visualization"]
build = "build.rs"

[lib]
name = "merman_core"

[features]
default = ["large-features"]
large-features = []

[dependencies]
euclid.workspace = true
htmlize.workspace = true
indexmap.workspace = true
lalrpop-util.workspace = true
logos.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
json5.workspace = true
thiserror.workspace = true
tracing.workspace = true
lol_html.workspace = true
url.workspace = true
uuid.workspace = true
chrono.workspace = true
ryu-js.workspace = true
rustc-hash.workspace = true

[build-dependencies]
lalrpop.workspace = true

[dev-dependencies]
futures.workspace = true
